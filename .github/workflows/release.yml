name: Push gem

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    runs-on: ubuntu-latest
    environment: release
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_BACKEND: vulkan
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: bundle exec ruby -Ilib -e 'require "wgpu/version"; abort "tag/version mismatch" unless ENV.fetch("GITHUB_REF_NAME") == "v#{WGPU::VERSION}"'
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools
      - run: vulkaninfo --summary
      - run: bundle exec rake wgpu:install
      - run: bundle exec rake wgpu:verify_abi
      - run: bundle exec rspec --tag '~gpu'
      - name: Run GPU tests and reject skips
        run: |
          mkdir -p tmp
          bundle exec rspec --tag gpu --format progress --format json --out tmp/gpu-results.json
          bundle exec ruby -rjson -e 'summary = JSON.parse(File.read("tmp/gpu-results.json")).fetch("summary"); abort "GPU examples skipped" unless summary.fetch("pending_count").zero?'
      - run: bundle exec rake examples:ci
      - run: bundle exec rubocop
      - run: bundle exec rbs -I sig validate
      - run: bundle exec yard doc --fail-on-warning
      - uses: rubygems/release-gem@v1
