name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native-artifacts:
    name: Native artifact / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            archive: wgpu-linux-x86_64-release.zip
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            archive: wgpu-linux-aarch64-release.zip
          - platform: macos-x86_64
            runner: macos-15-intel
            archive: wgpu-macos-x86_64-release.zip
          - platform: macos-aarch64
            runner: macos-15
            archive: wgpu-macos-aarch64-release.zip
          - platform: windows-x86_64
            runner: windows-2025
            archive: wgpu-windows-x86_64-msvc-release.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Download, verify, and load the platform artifact
        env:
          EXPECTED_ARCHIVE: ${{ matrix.archive }}
        run: |
          bundle exec rake wgpu:install
          bundle exec ruby -Ilib script/verify_native_artifact.rb

  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Vulkan loader (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1
      - name: Download and verify wgpu-native
        run: bundle exec rake wgpu:install
      - name: Verify Ruby enum ABI
        if: runner.os == 'Linux' && matrix.ruby == '3.4'
        run: bundle exec rake wgpu:verify_abi
      - name: Run GPU-independent tests
        run: bundle exec rspec --tag '~gpu'

  no-native:
    name: No native library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run installer and distribution tests
        env:
          WGPU_NO_NATIVE: "1"
        run: >-
          bundle exec rspec --tag no_native
          spec/wgpu/native/distribution_spec.rb
          spec/wgpu/native/installer_spec.rb
          spec/wgpu/native/loader_spec.rb

  no-sdl:
    name: Gem install and compute without SDL3
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: examples
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "${lavapipe_icd}"
          echo "VK_ICD_FILENAMES=${lavapipe_icd}" >> "${GITHUB_ENV}"
      - run: bundle exec rake wgpu:install
      - name: Build and install the gem without SDL3
        run: | # zizmor: ignore[adhoc-packages]
          bundle exec gem build wgpu.gemspec
          gem install --local --install-dir tmp/no-sdl-gems --ignore-dependencies wgpu-*.gem
      - name: Require the installed core without loading SDL3
        run: |
          bundle_gem_path="$(bundle exec ruby -e 'puts Gem.path.join(":")')"
          GEM_PATH="tmp/no-sdl-gems:${bundle_gem_path}" ruby -e 'require "wgpu"; abort "SDL3 unexpectedly loaded" if defined?(SDL3)'
      - name: Run compute examples without SDL3
        run: |
          for example in examples/0[1-6]_*.rb; do
            bundle exec ruby "${example}"
          done

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rubocop

  types:
    name: RBS and YARD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rbs -I sig validate
      - run: bundle exec yard doc --fail-on-warning
      - run: bundle exec ruby script/check_yard_coverage.rb

  gpu:
    name: GPU integration (lavapipe)
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "${lavapipe_icd}"
          echo "VK_ICD_FILENAMES=${lavapipe_icd}" >> "${GITHUB_ENV}"
      - name: Verify Vulkan software adapter
        run: vulkaninfo --summary
      - name: Download and verify wgpu-native
        run: bundle exec rake wgpu:install
      - name: Run baseline GPU tests and reject every skip
        run: |
          mkdir -p tmp
          bundle exec rspec --tag gpu --tag '~optional_feature' --format progress --format json --out tmp/gpu-results.json
          bundle exec ruby -rjson -e 'examples = JSON.parse(File.read("tmp/gpu-results.json")).fetch("examples"); pending = examples.select { |example| example["status"] == "pending" }; abort "GPU examples skipped: #{pending.map { |example| example["pending_message"] }.inspect}" unless pending.empty?'
      - name: Exercise optional GPU features
        run: bundle exec rspec --tag optional_feature
      - name: Run compute examples
        run: bundle exec rake examples:ci

  gpu-macos:
    name: GPU integration (Metal, optional)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake wgpu:install
      - name: Run GPU tests when Metal is exposed
        run: |
          mkdir -p tmp
          bundle exec rspec --tag gpu --tag '~optional_feature' --format progress --format json --out tmp/gpu-results.json
          bundle exec ruby -rjson -e 'examples = JSON.parse(File.read("tmp/gpu-results.json")).fetch("examples"); pending = examples.select { |example| example["status"] == "pending" }; abort "GPU examples skipped: #{pending.map { |example| example["pending_message"] }.inspect}" unless pending.empty?'
      - run: bundle exec rspec --tag optional_feature
