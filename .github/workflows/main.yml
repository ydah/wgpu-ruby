name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - 'head'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
      - name: Download wgpu-native
        run: bundle exec ruby ext/wgpu/extconf.rb
      - name: Run tests
        env:
          WGPU_SKIP_GPU_TESTS: "1"
        run: bundle exec rake spec
