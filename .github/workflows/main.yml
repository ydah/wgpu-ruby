name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Vulkan loader (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1
      - name: Download and verify wgpu-native
        run: bundle exec rake wgpu:install
      - name: Verify Ruby enum ABI
        if: runner.os == 'Linux' && matrix.ruby == '3.4'
        run: bundle exec rake wgpu:verify_abi
      - name: Run GPU-independent tests
        run: bundle exec rspec --tag '~gpu'

  no-native:
    name: No native library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run installer and distribution tests
        env:
          WGPU_NO_NATIVE: "1"
        run: >-
          bundle exec rspec --tag no_native
          spec/wgpu/native/distribution_spec.rb
          spec/wgpu/native/installer_spec.rb

  no-sdl:
    name: Core install without SDL3
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: examples
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake wgpu:install
      - name: Require core without loading SDL3
        run: bundle exec ruby -Ilib -e 'require "wgpu"; abort "SDL3 unexpectedly loaded" if defined?(SDL3)'

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rubocop

  gpu:
    name: GPU integration (lavapipe)
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools
      - name: Verify Vulkan software adapter
        run: vulkaninfo --summary
      - name: Download and verify wgpu-native
        run: bundle exec rake wgpu:install
      - name: Run GPU tests and reject skips
        run: |
          mkdir -p tmp
          bundle exec rspec --tag gpu --format progress --format json --out tmp/gpu-results.json
          bundle exec ruby -rjson -e 'summary = JSON.parse(File.read("tmp/gpu-results.json")).fetch("summary"); abort "GPU examples skipped" unless summary.fetch("pending_count").zero?'
      - name: Run compute examples
        run: bundle exec rake examples:ci
